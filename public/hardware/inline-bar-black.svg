<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 200" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="40%" stop-color="#1c1c1c"/>
      <stop offset="70%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="55%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-5%" width="160%" height="110%">
      <feDropShadow dx="0.8" dy="1" stdDeviation="1.1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Straight 1200-style pull: vertical bar + two door posts (side elevation). -->
  <g filter="url(#soft)">
    <rect x="4" y="46" width="16" height="10" rx="5" fill="url(#post)"/>
    <rect x="4" y="144" width="16" height="10" rx="5" fill="url(#post)"/>
    <rect x="18" y="8" width="14" height="184" rx="7" fill="url(#bar)"/>
  </g>
</svg>
