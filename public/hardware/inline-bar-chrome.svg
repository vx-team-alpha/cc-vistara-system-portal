<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 200" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f5f6"/>
      <stop offset="35%" stop-color="#c8ccd1"/>
      <stop offset="55%" stop-color="#9aa0a6"/>
      <stop offset="78%" stop-color="#dde1e5"/>
      <stop offset="100%" stop-color="#8b9198"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8eaed"/>
      <stop offset="50%" stop-color="#aeb4ba"/>
      <stop offset="100%" stop-color="#6f757c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-5%" width="160%" height="110%">
      <feDropShadow dx="0.8" dy="1" stdDeviation="1.1" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Straight 1200-style pull: vertical bar + two door posts (side elevation). -->
  <g filter="url(#soft)">
    <rect x="4" y="46" width="16" height="10" rx="5" fill="url(#post)"/>
    <rect x="4" y="144" width="16" height="10" rx="5" fill="url(#post)"/>
    <rect x="18" y="8" width="14" height="184" rx="7" fill="url(#bar)"/>
  </g>
</svg>
