<h2>Confirm your new email address</h2>

<p>Follow the link below to confirm this change.</p>

<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next={{ .RedirectTo }}"
  >
    Confirm email change
  </a>
</p>

<p>
  Note: with <code>double_confirm_changes</code> enabled in supabase/config.toml, this
  is sent to BOTH the old and the new address, and both must be confirmed.
</p>
