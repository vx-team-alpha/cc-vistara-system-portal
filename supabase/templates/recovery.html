<h2>Reset your password</h2>

<p>Follow the link below to choose a new password.</p>

<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/password-reset/update"
  >
    Reset password
  </a>
</p>

<p>
  If you did not request a password reset, you can safely ignore this email — your
  password will not change.
</p>
